<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miastenia gravis en Colombia</title>
<meta name="description" content="Tablero sobre miastenia gravis en Colombia con datos de SISPRO.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="Miastenia gravis en Colombia">
<meta property="og:description" content="Tablero con datos de SISPRO. Acceso con contraseña.">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_CO">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B5C6B'/%3E%3Cpath d='M12 40c8-18 16-18 20 0 4 18 12 18 20 0' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<!-- Pantalla de acceso. La app, los datos y los documentos están cifrados (AES-256-GCM); la
     contraseña deriva la clave en el navegador (PBKDF2-SHA256) y nunca sale de este equipo.
     Generada por scripts/build_site.py desde site/acceso.html. -->
<style id="gate-style">
  :root{ --canvas:#EEF3F5; --paper:#FFFFFF; --ink:#13202B; --ink-2:#3C505E; --muted:#62757D; --line:#D3DDE2; --brand:#0B5C6B; --brand-soft:#DCEEF1; --high:#C23A2E; color-scheme:light; }
  @media (prefers-color-scheme: dark){ :root{ --canvas:#0E171E; --paper:#131D26; --ink:#E7F0F2; --ink-2:#B9C9CF; --muted:#8FA2A9; --line:#25363F; --brand:#4FB6C8; --brand-soft:#12333B; --high:#E5675A; color-scheme:dark; } }
  .gate *{ box-sizing:border-box; }
  body.locked{ margin:0; min-height:100vh; display:grid; place-items:center; background:var(--canvas); color:var(--ink); font:400 17px/1.5 "Public Sans", "Segoe UI", system-ui, sans-serif; padding:20px; }
  .gate{ width:min(400px, 100%); background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:28px 26px 24px; box-shadow:0 10px 30px -18px rgba(19,32,43,.4); }
  .gate-mark{ width:44px; height:44px; display:block; margin-bottom:14px; }
  .gate h1{ font:600 1.55rem/1.15 "Source Serif 4", Georgia, serif; margin:0 0 6px; letter-spacing:-.01em; }
  .gate p{ margin:0 0 18px; color:var(--ink-2); font-size:.95rem; }
  .gate label{ display:block; font-weight:700; font-size:.85rem; color:var(--ink-2); margin-bottom:6px; }
  .gate input[type="password"]{ width:100%; font-weight:500; font-size:1rem; font-family:inherit; color:var(--ink); background:var(--paper); border:2px solid var(--ink); border-radius:12px; padding:11px 13px; }
  .gate input[type="password"]:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); }
  .gate .remember{ display:flex; align-items:center; gap:8px; font-weight:400; font-size:.88rem; margin:12px 0 18px; color:var(--ink-2); }
  .gate button{ width:100%; appearance:none; border:0; border-radius:12px; background:var(--brand); color:#fff; font-weight:700; font-size:1rem; font-family:inherit; padding:12px; cursor:pointer; }
  @media (prefers-color-scheme: dark){ .gate button{ color:#06222a; } }
  .gate button:disabled{ opacity:.6; cursor:progress; }
  .gate .err{ color:var(--high); font-weight:700; font-size:.9rem; min-height:1.4em; margin:10px 0 0; }
  .gate :focus-visible{ outline:3px solid var(--brand); outline-offset:2px; }
</style>
</head>
<body class="locked">
<form class="gate" id="gate" autocomplete="off">
  <svg class="gate-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0B5C6B"/><path d="M12 40c8-18 16-18 20 0 4 18 12 18 20 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>
  <h1 id="t">Miastenia gravis en Colombia</h1>
  <p id="d">Escribe la contraseña para ver el tablero. Si no la tienes, pídesela al autor.</p>
  <label for="pw" id="l">Contraseña</label>
  <input type="password" id="pw" name="pw" required autofocus autocomplete="current-password">
  <label class="remember"><input type="checkbox" id="remember"> <span id="r">Recordar en este equipo</span></label>
  <button type="submit" id="go">Entrar</button>
  <p class="err" id="err" role="alert"></p>
</form>
<script>
(function(){
  "use strict";
  const SALT = "ea4eaf588ccc7827905f0dab5b2bcab4", ITER = 600000, KEY = "mg_clave";
  const EN = /^en\b/i.test(navigator.language || "");
  const T = EN
    ? { t:"Myasthenia gravis in Colombia", d:"Enter the password to open the dashboard. If you do not have it, ask the author.", l:"Password", r:"Remember on this device", go:"Enter", opening:"Opening…", bad:"The password is not correct.", fail:"Could not open the dashboard" }
    : { t:"Miastenia gravis en Colombia", d:"Escribe la contraseña para ver el tablero. Si no la tienes, pídesela al autor.", l:"Contraseña", r:"Recordar en este equipo", go:"Entrar", opening:"Abriendo…", bad:"La contraseña no es correcta.", fail:"No se pudo abrir el tablero" };
  if (EN) { document.documentElement.lang = "en"; document.title = T.t; ["t","d","l","r","go"].forEach(function(k){ document.getElementById(k).textContent = T[k]; }); }
  const hex = (h)=> new Uint8Array(h.match(/../g).map(b=> parseInt(b, 16)));
  const b64 = (u)=> btoa(String.fromCharCode.apply(null, u));
  const unb64 = (s)=> Uint8Array.from(atob(s), c=> c.charCodeAt(0));
  const realFetch = window.fetch.bind(window);
  let aes = null;

  async function derive(pw){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name:"PBKDF2", hash:"SHA-256", salt:hex(SALT), iterations:ITER }, base, 512));
    return bits.slice(0, 32);
  }
  const importKey = (raw)=> crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  async function decrypt(buf){
    const u = new Uint8Array(buf);
    return crypto.subtle.decrypt({ name:"AES-GCM", iv:u.slice(0, 12) }, aes, u.slice(12));
  }
  const ENC = /^(?:\.\/)?((?:data|geo|docs)\/[^?#]+)(\?[^#]*)?$/;
  // la app pide data/, geo/ y docs/: se sirve el .bin cifrado y se entrega descifrado
  window.fetch = async function(input, init){
    const url = typeof input === "string" ? input : (input && input.url) || "";
    const m = aes && url.match(ENC);
    if(!m) return realFetch(input, init);
    const r = await realFetch(m[1]+".bin"+(m[2] || ""), init);
    if(!r.ok) return r;
    const plain = await decrypt(await r.arrayBuffer());
    return new Response(plain, { status:200 });
  };
  // las descargas de docs/ (enlaces <a href="docs/...">) se descifran y se bajan como archivo
  document.addEventListener("click", async function(e){
    const a = e.target.closest && e.target.closest('a[href^="docs/"]');
    if(!a || !aes) return;
    e.preventDefault();
    try {
      const r = await window.fetch(a.getAttribute("href"));
      if(!r.ok) throw new Error(r.status);
      const url = URL.createObjectURL(await r.blob());
      const d = document.createElement("a"); d.href = url; d.download = a.getAttribute("href").split("/").pop();
      document.body.appendChild(d); d.click(); d.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    } catch(x){ /* sin descarga */ }
  });
  async function open(raw, remember){
    aes = await importKey(raw);
    const r = await realFetch("app.bin", { cache:"no-cache" });
    if(!r.ok) throw new Error("app.bin respondió "+r.status);
    let bundle;
    try { bundle = JSON.parse(new TextDecoder().decode(await decrypt(await r.arrayBuffer()))); }
    catch(e){ aes = null; throw new Error("clave"); }
    const store = remember ? localStorage : sessionStorage;
    try { store.setItem(KEY, b64(raw)); } catch(e){}
    document.getElementById("gate-style").remove();
    document.body.className = "";
    const style = document.createElement("style"); style.textContent = bundle.css; document.head.appendChild(style);
    bundle.pre.forEach(function(src){ const s = document.createElement("script"); s.textContent = src; document.head.appendChild(s); });
    document.body.innerHTML = bundle.html;
    bundle.scripts.forEach(function(src){ const s = document.createElement("script"); s.textContent = src; document.body.appendChild(s); });
  }
  const form = document.getElementById("gate"), err = document.getElementById("err"), go = document.getElementById("go");
  form.addEventListener("submit", async (e)=>{
    e.preventDefault(); err.textContent = ""; go.disabled = true; go.textContent = T.opening;
    try { await open(await derive(document.getElementById("pw").value.trim()), document.getElementById("remember").checked); }
    catch(x){
      go.disabled = false; go.textContent = T.go;
      err.textContent = x.message === "clave" ? T.bad : T.fail+" ("+x.message+").";
      document.getElementById("pw").select();
    }
  });
  // si este equipo ya tiene la clave (sesión o «recordar»), se abre directo
  let saved = null;
  try { saved = sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch(e){}
  if(saved) open(unb64(saved), !!localStorage.getItem(KEY)).catch(()=>{ try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch(e){} });
})();
</script>
</body>
</html>
